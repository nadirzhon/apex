name: xben001-context

on:
  push:
    branches:
      - agent/xben-local-lab-solver

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: xbow-engineering/validation-benchmarks
          path: xben
          persist-credentials: false
      - name: Build isolated benchmark
        working-directory: xben/benchmarks/XBEN-001-24
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            PORT=$(docker compose port idor_broken_authz_trading_platform 80 2>/dev/null | tail -1 | awk -F: '{print $NF}')
            if [ -n "$PORT" ] && curl -fsS "http://127.0.0.1:$PORT/" >/dev/null; then
              echo "TARGET=http://127.0.0.1:$PORT/" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Inspect already-discovered authenticated orders page
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from http.cookiejar import CookieJar
          from pathlib import Path
          from apex.local_html_intel import extract_route_contexts

          root=os.environ['TARGET']
          jar=CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def post(url,data):
              req=urllib.request.Request(url,data=urllib.parse.urlencode(data).encode(),headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
              with op.open(req,timeout=5) as r: return r.read(1_000_000).decode('utf-8','replace')
          post(root, {'username':'test'})
          post(urllib.parse.urljoin(root,'/password/test'), {'username':'test','user_id':'10032','password':'test'})
          with op.open(urllib.parse.urljoin(root,'/orders'),timeout=5) as r:
              body=r.read(1_000_000).decode('utf-8','replace')
          contexts=extract_route_contexts(body)
          Path('xben001-route-contexts.json').write_text(json.dumps({'contexts':contexts},indent=2),encoding='utf-8')
          print(json.dumps({'contexts':contexts},indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xben001-route-contexts
          path: xben001-route-contexts.json
          retention-days: 7
      - if: always()
        working-directory: xben/benchmarks/XBEN-001-24
        run: docker compose down -v --remove-orphans
