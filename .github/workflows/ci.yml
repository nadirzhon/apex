name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check apex tests
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o .apex/bin/apex-core ./cmd/apex-core
