name: autonoma-live-safe-audit

on:
  push:
    branches:
      - agent/run-autonoma-live-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create explicit authorized scope
        run: |
          cat > /tmp/autonoma-scope.json <<'JSON'
          {
            "program": "Autonoma owner-authorized production audit",
            "platform": "owner",
            "authorized": true,
            "researcher": "nadirzhon",
            "rate_limit_rps": 1,
            "in_scope": ["autonoma.uk"],
            "out_of_scope": [],
            "rules": "Passive production audit only: three bounded GET requests; no mutation, brute force, fuzzing, payload injection, or cross-origin traversal."
          }
          JSON
      - name: Run APEX safe audit
        run: |
          python -m apex.safe_audit \
            --scope /tmp/autonoma-scope.json \
            --i-am-authorized \
            --target https://autonoma.uk \
            --out autonoma-safe-audit.json
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: autonoma-safe-audit
          path: autonoma-safe-audit.json
          if-no-files-found: error
