[project]
name = "apex-bounty"
version = "1.0.0"
description = "Платформа автоматизации авторизованного bug bounty корпоративного масштаба со scope-гейтом и мостом MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nadirzhon" }]
keywords = ["bug-bounty", "security", "appsec", "mcp", "recon", "authorized"]
dependencies = []  # ядро — чистый stdlib

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
browser = ["playwright>=1.50"]

[project.scripts]
apex = "apex.cli:main"
apex-auto = "apex.auto_cli:main"

[project.urls]
Homepage = "https://github.com/nadirzhon/apex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]
