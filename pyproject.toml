[project]
name = "apex-bounty"
version = "1.3.0"
description = "Платформа автоматизации авторизованного bug bounty корпоративного масштаба со scope-гейтом и мостом MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nadirzhon" }]
keywords = ["bug-bounty", "security", "appsec", "mcp", "recon", "authorized"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []  # ядро — чистый stdlib

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
browser = ["playwright>=1.50"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
apex = "apex.cli:main"
apex-auto = "apex.auto_cli:main"

[project.urls]
Homepage = "https://github.com/nadirzhon/apex"
Repository = "https://github.com/nadirzhon/apex"
Issues = "https://github.com/nadirzhon/apex/issues"
Changelog = "https://github.com/nadirzhon/apex/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pragmatic, mostly auto-fixable rule set. The project ships intentional
# Russian-language content and defensive blanket error handling, so a few
# opinionated/locale rules are disabled on purpose.
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "FURB"]
ignore = [
  "E501",   # long lines: long Russian advice/report strings
  "ISC004", # intentional implicit string concatenation in advice literals
  "B008",   # function calls in argument defaults used intentionally
  "FURB167",# regex flag alias style — cosmetic
]
